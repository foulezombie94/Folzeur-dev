[package]
name = "local_ai_agent_native"
version = "1.0.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi4", "async", "tokio_rt", "serde-json"] }
napi-derive = "2.16"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
fastembed = { version = "6.0.0", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
lancedb = { version = "0.37.1", default-features = false }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tokio = { version = "1.37", features = ["rt-multi-thread", "sync"] }
futures-util = "0.3"
fs2 = "0.4"
tantivy = { version = "=0.27.0", git = "https://github.com/quickwit-oss/tantivy", rev = "266a6c48f2abded7a13dfbdc43801fdc7344114c" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ignore = "0.4"
globset = "0.4"
sha2 = "0.10"
dunce = "1.0"
arrow-array = "=58.4.0"
arrow-schema = "=58.4.0"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
strip = "symbols"

[patch.crates-io]
# `paste` is archived and has no fixed upstream release. Keep its public macro
# surface for transitive consumers while delegating to the maintained `pastey` fork.
paste = { path = "vendor/paste-compat" }
