[package]
name = "local_ai_agent_native"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi4", "async", "tokio_rt", "serde-json"] }
napi-derive = "2.16"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
fastembed = { version = "3.14.1", default-features = false, features = ["online", "ort-download-binaries"] }
lancedb = { version = "0.37.1", default-features = false }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tokio = { version = "1.37", features = ["rt-multi-thread", "sync"] }
futures-util = "0.3"
fs2 = "0.4"
tantivy = "0.26.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ignore = "0.4"
arrow-array = "=58.4.0"
arrow-schema = "=58.4.0"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
