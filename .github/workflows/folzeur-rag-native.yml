name: Folzeur RAG native artifacts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'folzeur-rag-native/**'
      - '.github/workflows/folzeur-rag-native.yml'

permissions:
  contents: read

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: windows-11-arm
            artifact: windows-arm64
          - os: ubuntu-latest
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
          - os: macos-15-intel
            artifact: macos-x64
          - os: macos-14
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: folzeur-rag-native
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: folzeur-rag-native/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: npm ci
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: folzeur-rag-native-${{ matrix.artifact }}
          path: folzeur-rag-native/*.node
          if-no-files-found: error
          retention-days: 14
